name: Gerar receitas

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia às 07:17 (horário de Brasília = UTC-3)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      quantidade:
        description: "Quantos posts gerar"
        default: "1"

permissions:
  contents: write

concurrency:
  group: estado-do-bot
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Gerar posts
        run: python gerar.py ${{ github.event.inputs.quantidade }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          QTD_POR_DIA: ${{ vars.QTD_POR_DIA }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "bot-receitas"
          git config user.email "bot-receitas@users.noreply.github.com"
          git add estado
          git diff --cached --quiet || (git commit -m "chore: atualiza estado do bot" && git pull --rebase && git push)
