name: Verificar aprovações

on:
  schedule:
    - cron: "*/20 * * * *"   # a cada 20 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-do-bot
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Processar botões do Telegram
        run: python verificar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          HORARIOS: ${{ vars.HORARIOS }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "bot-receitas"
          git config user.email "bot-receitas@users.noreply.github.com"
          git add estado
          git diff --cached --quiet || (git commit -m "chore: atualiza estado do bot" && git pull --rebase && git push)
